<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付宝H5授权</title>
    <script src="https://gw.alipayobjects.com/as/g/h5-lib/alipayjsapi/3.1.1/alipayjsapi.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1677ff, #69b1ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 360px;
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #1677ff;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #0958d9;
        }

        .result {
            margin-top: 20px;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">支付宝授权</div>
    <div class="desc">点击下方按钮获取用户授权信息</div>
    <button id="authBtn" class="btn">获取授权</button>
    <div id="result" class="result"></div>
</div>

<script>
    const appId = '你的APPID'; // TODO: 替换成你的APPID

    document.querySelector('#authBtn').addEventListener('click', function () {
        if (typeof ap === 'undefined') {
            alert('请在支付宝客户端中打开');
            return;
        }

        ap.getAuthCode({
            appId: appId,
            scopes: ['auth_user'],
        }, function (res) {
            const resultBox = document.getElementById('result');
            resultBox.style.display = 'block';
            resultBox.innerText = JSON.stringify(res, null, 2);

            if (res.authCode) {
                alert('授权成功，authCode：' + res.authCode);
            } else {
                alert('授权失败');
            }
        });
    });
</script>

</body>
</html>
